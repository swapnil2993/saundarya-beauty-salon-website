# Netlify runs on its own edge infrastructure and ignores .htaccess (an Apache
# config file). This file replaces it so caching/compression actually apply.
# Netlify already serves gzip/brotli compression automatically.

# Regenerates img/gallery/manifest.json from whatever images are in
# img/gallery/ at deploy time - see scripts/build-gallery.js.
[build]
  command = "node scripts/build-gallery.js"
  publish = "."

# Kept short (unlike /img/* below) since this file is meant to change
# whenever photos are added/removed from img/gallery/.
[[headers]]
  for = "/img/gallery/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The service worker must never be served stale, otherwise browsers can
# take a long time to pick up a new version (overriding the /*.js rule
# below, which would otherwise cache it for 30 days).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Netlify doesn't know the .webmanifest extension and falls back to
# application/octet-stream, which Chrome silently refuses to parse as a
# web app manifest - breaking PWA installability (no "Add to Home
# Screen" prompt on Android). Force the correct MIME type.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
